name: Server Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths-ignore:
      - 'android/**'
      - 'ios/**'
  pull_request:
    paths-ignore:
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test bootJar

      - name: Verify embedded Tomcat security baseline
        run: |
          ./gradlew --no-daemon dependencyInsight \
            --dependency tomcat-embed-core \
            --configuration runtimeClasspath > tomcat-dependency.txt
          cat tomcat-dependency.txt
          grep -q 'org.apache.tomcat.embed:tomcat-embed-core:10.1.61' tomcat-dependency.txt
