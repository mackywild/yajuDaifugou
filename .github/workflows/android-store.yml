name: Android Store Test AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YAJU_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YAJU_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing YAJU_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing YAJU_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing YAJU_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing YAJU_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.YAJU_UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yaju-upload.jks"

      - name: Show upload certificate fingerprints
        env:
          YAJU_STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          YAJU_KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/yaju-upload.jks" \
            -alias "$YAJU_KEY_ALIAS" \
            -storepass "$YAJU_STORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

      - name: Build signed release AAB
        working-directory: android
        env:
          YAJU_KEYSTORE_PATH: ${{ runner.temp }}/yaju-upload.jks
          YAJU_STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          YAJU_KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
          YAJU_KEY_PASSWORD: ${{ secrets.YAJU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: YajuDaifugou-v0.5.0-test01-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yaju-upload.jks"
