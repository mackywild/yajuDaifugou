name: Android Store Test AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YAJU_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YAJU_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing YAJU_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing YAJU_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing YAJU_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing YAJU_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.YAJU_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yaju-upload.jks"
          test -s "$RUNNER_TEMP/yaju-upload.jks" || (echo "Decoded keystore is empty" && exit 1)

      - name: Validate keystore password and alias
        env:
          YAJU_STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          YAJU_KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
        run: |
          keytool -list             -keystore "$RUNNER_TEMP/yaju-upload.jks"             -storepass "$YAJU_STORE_PASSWORD"             -alias "$YAJU_KEY_ALIAS"             >/dev/null
          echo "Keystore password and alias are valid."

      - name: Validate private key password
        env:
          YAJU_STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          YAJU_KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
          YAJU_KEY_PASSWORD: ${{ secrets.YAJU_KEY_PASSWORD }}
        run: |
          printf 'signing-smoke-test' > "$RUNNER_TEMP/signing-smoke.txt"
          jar --create --file "$RUNNER_TEMP/signing-smoke.jar" -C "$RUNNER_TEMP" signing-smoke.txt
          jarsigner             -keystore "$RUNNER_TEMP/yaju-upload.jks"             -storepass "$YAJU_STORE_PASSWORD"             -keypass "$YAJU_KEY_PASSWORD"             "$RUNNER_TEMP/signing-smoke.jar"             "$YAJU_KEY_ALIAS"             >/dev/null
          jarsigner -verify "$RUNNER_TEMP/signing-smoke.jar" >/dev/null
          echo "Private key password is valid."

      - name: Show upload certificate fingerprints
        env:
          YAJU_STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          YAJU_KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
        run: |
          keytool -list -v             -keystore "$RUNNER_TEMP/yaju-upload.jks"             -alias "$YAJU_KEY_ALIAS"             -storepass "$YAJU_STORE_PASSWORD"             | grep -E "SHA1:|SHA256:"

      - name: Resolve release version
        working-directory: android
        run: |
          VERSION_NAME="$(grep '^YAJU_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))"
          test -n "$VERSION_NAME" || (echo "YAJU_VERSION_NAME is missing" && exit 1)
          test "$VERSION_CODE" -gt 9 || (echo "versionCode must be greater than the last Play versionCode" && exit 1)
          echo "YAJU_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "YAJU_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building versionName=$VERSION_NAME / versionCode=$VERSION_CODE"

      - name: Build signed release AAB
        working-directory: android
        env:
          YAJU_KEYSTORE_PATH: ${{ runner.temp }}/yaju-upload.jks
          YAJU_STORE_PASSWORD: ${{ secrets.YAJU_STORE_PASSWORD }}
          YAJU_KEY_ALIAS: ${{ secrets.YAJU_KEY_ALIAS }}
          YAJU_KEY_PASSWORD: ${{ secrets.YAJU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease \
            -PYAJU_VERSION_CODE="$YAJU_VERSION_CODE" \
            -PYAJU_VERSION_NAME="$YAJU_VERSION_NAME"

      - name: Show built version
        run: |
          echo "versionName=$YAJU_VERSION_NAME"
          echo "versionCode=$YAJU_VERSION_CODE"

      - name: Verify release AAB signature
        run: |
          jarsigner -verify -verbose -certs             android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: YajuDaifugou-store-aab-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yaju-upload.jks"
