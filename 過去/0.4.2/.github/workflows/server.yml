name: Server Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths-ignore:
      - 'android/**'
      - 'ios/**'
  pull_request:
    paths-ignore:
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test
