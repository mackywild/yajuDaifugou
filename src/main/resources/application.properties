spring.application.name=yaju-daifugou
server.port=${PORT:8080}
# On the public VPS set SERVER_ADDRESS=127.0.0.1; Caddy handles external access.
# Keep the development default for LAN testing with real devices.
server.address=${SERVER_ADDRESS:0.0.0.0}
# Honor X-Forwarded-Proto / Host supplied by the trusted local reverse proxy.
server.forward-headers-strategy=framework

# 必須。未設定の場合はAuthControllerの初期化で起動を拒否する。
daifugo.access-password=${DAIFUGO_PASSWORD:}

# 無操作の部屋は30分で破棄する。
daifugo.room-ttl-ms=${DAIFUGO_ROOM_TTL_MS:1800000}
daifugo.room-cleanup-interval-ms=${DAIFUGO_ROOM_CLEANUP_INTERVAL_MS:300000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true only after HTTPS is live.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 共通パスワードへの総当たり対策。
daifugo.login-max-failures=${DAIFUGO_LOGIN_MAX_FAILURES:5}
daifugo.login-lock-ms=${DAIFUGO_LOGIN_LOCK_MS:60000}
daifugo.login-attempt-retention-ms=${DAIFUGO_LOGIN_ATTEMPT_RETENTION_MS:3600000}
daifugo.login-attempt-cleanup-ms=${DAIFUGO_LOGIN_ATTEMPT_CLEANUP_MS:600000}
