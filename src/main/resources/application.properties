spring.application.name=yaju-daifugou
server.port=${PORT:8080}
# Production: bind only to loopback behind the local Caddy reverse proxy.
# LAN development: set DAIFUGO_BIND_ADDRESS=0.0.0.0 explicitly.
server.address=${DAIFUGO_BIND_ADDRESS:127.0.0.1}
# Only the loopback proxy is trusted to provide the external client IP and HTTPS scheme.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1

# 必須。未設定の場合はAuthControllerの初期化で起動を拒否する。
daifugo.access-password=${DAIFUGO_PASSWORD:}

# 無操作の部屋は30分で破棄する。
daifugo.room-ttl-ms=${DAIFUGO_ROOM_TTL_MS:1800000}
daifugo.room-cleanup-interval-ms=${DAIFUGO_ROOM_CLEANUP_INTERVAL_MS:300000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Production: SESSION_COOKIE_SECURE=true; keep HTTP local development possible.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Do not use '*': WebSocket upgrades must originate from the public site or a trusted dev host.
# For LAN browser testing, override DAIFUGO_ALLOWED_ORIGINS with an explicit origin.
daifugo.websocket.allowed-origins=${DAIFUGO_ALLOWED_ORIGINS:https://yajudaifugou.com,http://localhost:8080,http://127.0.0.1:8080}

# 共通パスワードへの総当たり対策。
daifugo.login-max-failures=${DAIFUGO_LOGIN_MAX_FAILURES:5}
daifugo.login-lock-ms=${DAIFUGO_LOGIN_LOCK_MS:60000}
daifugo.login-attempt-retention-ms=${DAIFUGO_LOGIN_ATTEMPT_RETENTION_MS:3600000}
daifugo.login-attempt-cleanup-ms=${DAIFUGO_LOGIN_ATTEMPT_CLEANUP_MS:600000}
